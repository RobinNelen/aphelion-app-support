<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aphelion</title>
  <link rel="icon" href="icon.png">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font: 17px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; color: #e8e6e1;
      background: radial-gradient(1200px 600px at 50% -200px, #1d2433 0%, #0a0b0f 60%) fixed, #0a0b0f; }
    header { text-align: center; padding: 3rem 1.25rem 1rem; }
    header img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 40px rgba(120,160,255,.25); }
    header .brand { font-family: Georgia, "Times New Roman", serif; font-size: 2rem; letter-spacing: .02em; margin: .8rem 0 .2rem; color: #fff; }
    header .tag { color: #8b93a3; font-size: .95rem; margin: 0; }
    nav { display: flex; justify-content: center; gap: .5rem; margin: 1.4rem 0 0; }
    nav a { color: #e8e6e1; text-decoration: none; padding: .45rem 1rem; border-radius: 999px; border: 1px solid #2a2f3a; font-size: .95rem; }
    nav a.on, nav a:hover { background: #f1efe9; color: #0a0b0f; border-color: #f1efe9; }
    main { max-width: 40rem; margin: 1.5rem auto 3rem; padding: 2rem 1.75rem; background: rgba(20,22,28,.75); border: 1px solid #22262f; border-radius: 20px; }
    h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 .4rem; color: #fff; }
    h2 { font-size: 1.05rem; margin: 1.8rem 0 .4rem; color: #fff; letter-spacing: .01em; }
    p { margin: .45rem 0; }
    a { color: #9cc3ff; }
    code { background: #1a1d24; padding: .1rem .35rem; border-radius: 6px; font-size: .9em; }
    .meta { color: #8b93a3; font-size: .95rem; }
    footer { text-align: center; color: #5f6675; font-size: .85rem; padding: 0 1rem 2.5rem; }
  </style>
</head>
<body>
  <header>
    <img src="icon.png" alt="Aphelion app icon">
    <div class="brand">Aphelion</div>
    <p class="tag">Fly real orbits. Learn real physics.</p>
    <nav><a href="privacy.html">Privacy</a><a href="support.html">Support</a></nav>
  </header>
  <main style="text-align:center"><h1>Welcome</h1><p>Aphelion is a single-player space game for iPhone, iPad and Mac.</p></main>
  <footer>© 2026 Robin Nelen · Nelen Consult</footer>
</body>
</html>
